version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      PORT: "9000"
    restart: unless-stopped

  yjs:
    build: ./yjs-server
    ports:
      - "1234:1234"
    env_file:
      - .env
    environment:
      PORT: "1234"
    restart: unless-stopped

  peer:
    build: ./peer-server
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
    restart: unless-stopped
