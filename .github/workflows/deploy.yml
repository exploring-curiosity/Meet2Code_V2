name: Deploy to GCP VM

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare repo and env
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            if [ ! -d "$HOME/Meet2Code_V2" ]; then
              git clone https://github.com/exploring-curiosity/Meet2Code_V2.git "$HOME/Meet2Code_V2"
            fi
            cd "$HOME/Meet2Code_V2"
            git fetch --all
            git reset --hard origin/main

            cat > .env << 'EOF'
            POSTGRES_URL=${{ secrets.POSTGRES_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            MONGODB_DATABASE=${{ secrets.MONGODB_DATABASE }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            SESSION_COOKIE_NAME=${{ vars.SESSION_COOKIE_NAME }}
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
            M2C_GIT_CLIENT_ID=${{ secrets.M2C_GIT_CLIENT_ID }}
            M2C_GIT_CLIENT_SECRET=${{ secrets.M2C_GIT_CLIENT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_YJS_URL=${{ vars.NEXT_PUBLIC_YJS_URL }}
            NEXT_PUBLIC_PEER_URL=${{ vars.NEXT_PUBLIC_PEER_URL }}
            WS_PATH=${{ vars.WS_PATH }}
            EOF

      - name: Build backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "$HOME/Meet2Code_V2"
            docker compose build backend

      - name: Build yjs
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "$HOME/Meet2Code_V2"
            docker compose build yjs

      - name: Build peer
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "$HOME/Meet2Code_V2"
            docker compose build peer

      - name: Build frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "$HOME/Meet2Code_V2"
            docker compose build frontend

      - name: Restart services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "$HOME/Meet2Code_V2"
            docker compose up -d
            docker image prune -f
